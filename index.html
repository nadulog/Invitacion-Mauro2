<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060d22" />
    <meta name="description" content="Medio siglo de vida, amigos y fútbol ⚽ Me haría muy feliz que estés conmigo para festejar mis 50 el sábado 23 de enero. ¡Te espero con todo mi cariño! 💛✨" />
    <link rel="canonical" href="https://bloomdate-mauro-50.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bloomdate-mauro-50.netlify.app/" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Mis 50 · Mauro" />
    <meta property="og:title" content="Mauro · 50 ⚽ ¡Estás invitado/a!" />
    <meta property="og:description" content="Medio siglo de vida, amigos y fútbol ⚽ Me haría muy feliz que estés conmigo para festejar mis 50 el sábado 23 de enero. ¡Te espero con todo mi cariño! 💛✨" />
    <meta property="og:image" content="https://bloomdate-mauro-50.netlify.app/assets/whatsapp-mauro.jpg?v=2" />
    <meta property="og:image:secure_url" content="https://bloomdate-mauro-50.netlify.app/assets/whatsapp-mauro.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mauro 50, en letras doradas, con la silueta de un jugador festejando con los brazos en alto" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mauro · 50 ⚽ ¡Estás invitado/a!" />
    <meta name="twitter:description" content="Medio siglo de vida, amigos y fútbol ⚽ Me haría muy feliz que estés conmigo para festejar mis 50 el sábado 23 de enero. ¡Te espero con todo mi cariño! 💛✨" />
    <meta name="twitter:image" content="https://bloomdate-mauro-50.netlify.app/assets/whatsapp-mauro.jpg?v=2" />
    <title>Mauro · 50</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Cinzel:wght@500;600&family=Great+Vibes&display=swap"
    />
    <link rel="preload" as="image" href="assets/portada.webp" fetchpriority="high" />
    <link rel="stylesheet" href="styles.css?v=11" />
  </head>
  <body>
    <!-- Intro: solo la portada, completa, y los botones para entrar con o sin música -->
    <div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="Mauro 50">
      <img class="intro__img" src="assets/portada.webp" alt="Mauro 50" width="941" height="1672" />
      <div class="intro__actions">
        <button class="intro__btn intro__btn--music" type="button" data-music="on">Entrar con música</button>
        <button class="intro__btn intro__btn--silent" type="button" data-music="off">Entrar sin música</button>
      </div>
    </div>

    <main class="invitation" id="invitation" aria-label="Invitación a los 50 de Mauro">
      <!-- 1. Portada: brillo, estrellas que titilan y papelitos azul y oro -->
      <section class="panel panel--cover" aria-labelledby="cover-title" style="--bg: url(assets/portada.webp)">
        <div class="panel__stage">
          <h1 id="cover-title" class="sr-only">Mauro 50</h1>
          <img src="assets/portada.webp" alt="Mauro 50, en letras doradas, con la silueta de un jugador festejando con los brazos en alto" width="941" height="1672" fetchpriority="high" />
          <span class="cover__shine" aria-hidden="true"></span>
          <span class="cover__glow" aria-hidden="true"></span>
          <div class="sparkles" aria-hidden="true">
            <i style="--x: 42.8%; --y: 74.6%; --d: 0s"></i>
            <i style="--x: 50%; --y: 74.3%; --d: 1.1s"></i>
            <i style="--x: 57.1%; --y: 74.6%; --d: 2.2s"></i>
            <i style="--x: 19.6%; --y: 14.8%; --d: 0.6s"></i>
            <i style="--x: 92.3%; --y: 8.6%; --d: 2.8s"></i>
            <i style="--x: 87%; --y: 70%; --d: 1.7s"></i>
          </div>
          <div class="papelitos" aria-hidden="true"></div>
        </div>
      </section>

      <!-- 2. Invitados -->
      <section class="panel panel--guests" aria-labelledby="guests-title" style="--bg: url(assets/invitados.webp)">
        <div class="panel__stage">
          <img src="assets/invitados.webp" alt="" width="941" height="1672" loading="lazy" />
          <div class="guests reveal">
            <p class="guests__eyebrow">Mauro · 50</p>
            <h2 id="guests-title" class="guests__title">Esta invitación es para</h2>
            <p class="guests__names" id="nombres-invitados"></p>
            <div class="stars-divider" aria-hidden="true"><span></span><b>★</b><b>★</b><b>★</b><span></span></div>
            <p class="guests__places" id="cantidad-lugares"></p>
          </div>
        </div>
      </section>

      <!-- 3. Cuenta regresiva -->
      <section class="panel panel--countdown" aria-labelledby="countdown-title" style="--bg: url(assets/cuenta-regresiva.webp?v=2)">
        <div class="panel__stage">
          <h2 id="countdown-title" class="sr-only">Falta muy poco</h2>
          <img src="assets/cuenta-regresiva.webp?v=2" alt="Falta muy poco" width="941" height="1672" loading="lazy" />
          <span class="watch-glow" aria-hidden="true"></span>
          <!-- Aguja del cronómetro: avanza un paso por segundo -->
          <svg class="watch-hand" id="watchHand" viewBox="-10 -210 20 260" aria-hidden="true">
            <defs>
              <linearGradient id="handFill" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#6b4a1f" />
                <stop offset="0.5" stop-color="#2b1c0b" />
                <stop offset="1" stop-color="#4a3214" />
              </linearGradient>
            </defs>
            <path d="M0 -205 L3.4 -18 L2.6 44 L-2.6 44 L-3.4 -18 Z" fill="url(#handFill)" stroke="#d6a95a" stroke-width="0.9" stroke-linejoin="round" />
            <circle cy="30" r="5.5" fill="url(#handFill)" stroke="#d6a95a" stroke-width="0.9" />
          </svg>
          <span class="watch-cap" aria-hidden="true"></span>
          <div class="countdown" role="timer" aria-label="Tiempo restante para la fiesta">
            <span class="countdown__value" style="--x: 14.3%" id="cdDays">00</span>
            <span class="countdown__value" style="--x: 37.9%" id="cdHours">00</span>
            <span class="countdown__value" style="--x: 62.1%" id="cdMinutes">00</span>
            <span class="countdown__value" style="--x: 86.3%" id="cdSeconds">00</span>
          </div>
        </div>
      </section>

      <!-- 4. Fecha y hora -->
      <section class="panel panel--date" aria-labelledby="date-title" style="--bg: url(assets/fecha-hora.webp)">
        <div class="panel__stage">
          <h2 id="date-title" class="sr-only">Agendá la fecha</h2>
          <img src="assets/fecha-hora.webp" alt="Agendá la fecha: sábado 23 de enero de 2027, de 21:00 a 01:00 hs" width="941" height="1672" loading="lazy" />
          <span class="spotlight" aria-hidden="true"></span>
          <a
            class="gold-btn gold-btn--calendar"
            href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Cumple%2050%20de%20Mauro%20%E2%9A%BD&amp;dates=20270124T000000Z/20270124T040000Z&amp;details=%C2%A1Te%20espero%20para%20festejar%20mis%2050!&amp;location=Room%20Eventos%2C%20Epecu%C3%A9n%204735%2C%20Villa%20Devoto%2C%20CABA"
            target="_blank"
            rel="noreferrer"
          >Guardar en calendario</a>
        </div>
      </section>

      <!-- 5. Cómo llegar -->
      <section class="panel panel--map" aria-labelledby="map-title" style="--bg: url(assets/como-llegar.webp)">
        <div class="panel__stage">
          <h2 id="map-title" class="sr-only">Cómo llegar</h2>
          <img src="assets/como-llegar.webp" alt="Cómo llegar: Room Eventos" width="941" height="1672" loading="lazy" />
          <!-- Huellas: se prenden una tras otra, como alguien caminando hasta el pin -->
          <img class="huella" src="assets/huella-1.png" alt="" width="98" height="78" aria-hidden="true" style="--x: 32.519%; --y: 42.584%; --w: 10.414%; --d: 0s" />
          <img class="huella" src="assets/huella-2.png" alt="" width="95" height="64" aria-hidden="true" style="--x: 60.680%; --y: 38.995%; --w: 10.096%; --d: 0.7s" />
          <img class="huella" src="assets/huella-3.png" alt="" width="69" height="66" aria-hidden="true" style="--x: 84.272%; --y: 23.804%; --w: 7.333%; --d: 1.4s" />
          <img class="huella" src="assets/huella-4.png" alt="" width="69" height="57" aria-hidden="true" style="--x: 66.844%; --y: 16.268%; --w: 7.333%; --d: 2.1s" />
          <span class="pin-glow" aria-hidden="true"></span>
          <button class="hotspot hotspot--map" id="openLocation" type="button"><span class="sr-only">Ver ubicación de Room Eventos</span></button>
        </div>
      </section>

      <!-- 6. Música -->
      <section class="panel panel--music" aria-labelledby="music-title" style="--bg: url(assets/musica.webp)">
        <div class="panel__stage">
          <h2 id="music-title" class="sr-only">Música</h2>
          <img src="assets/musica.webp" alt="Música. ¿Qué canción no puede faltar?" width="941" height="1672" loading="lazy" />
          <!-- La etiqueta del disco gira "acostada" sobre el tocadiscos; el eje dorado queda quieto -->
          <div class="disc" aria-hidden="true"><img src="assets/disco-etiqueta.webp?v=1" alt="" width="696" height="696" loading="lazy" /></div>
          <img class="disc-axis" src="assets/disco-eje.webp?v=1" alt="" width="160" height="160" loading="lazy" aria-hidden="true" />
          <div class="notes" aria-hidden="true">
            <i style="--x: 70%; --y: 30%; --d: 0s">♪</i>
            <i style="--x: 22%; --y: 22%; --d: 1.3s">♫</i>
            <i style="--x: 58%; --y: 18%; --d: 2.4s">♪</i>
            <i style="--x: 34%; --y: 40%; --d: 3.1s">♬</i>
          </div>
          <a
            class="hotspot hotspot--music"
            href="https://open.spotify.com/playlist/71HghVs8vEz9S9tWaqfgxy"
            target="_blank"
            rel="noreferrer"
          ><span class="sr-only">Sugerir canción</span></a>
        </div>
      </section>

      <!-- 7. BloomKeep -->
      <section class="panel panel--bloomkeep" aria-labelledby="bloomkeep-title" style="--bg: url(assets/bloomkeep.webp?v=2)">
        <div class="panel__stage">
          <h2 id="bloomkeep-title" class="sr-only">BloomKeep</h2>
          <img src="assets/bloomkeep.webp?v=2" alt="BloomKeep. Compartí tus fotos y videos de esta noche" width="941" height="1672" loading="lazy" />
          <!-- Fotos de Mauro dentro de las polaroid: con cada flash sale una nueva
               (data-quad = esquinas de la ventana de la foto en la imagen de 941×1672) -->
          <div class="pol pol--back" data-quad="754,363 982,413 930.7,611.7 712,561" aria-hidden="true">
            <img src="assets/foto-muelle.webp?v=1" alt="" loading="lazy" />
            <img src="assets/foto-playa.webp?v=1" alt="" loading="lazy" />
            <img src="assets/foto-balcon.webp?v=1" alt="" loading="lazy" />
          </div>
          <div class="pol pol--front" data-quad="313,594 630.5,551 725,776 389,832" aria-hidden="true">
            <img src="assets/foto-muelle.webp?v=1" alt="" loading="lazy" />
            <img src="assets/foto-playa.webp?v=1" alt="" loading="lazy" />
            <img src="assets/foto-balcon.webp?v=1" alt="" loading="lazy" />
          </div>
          <span class="keep-wash" aria-hidden="true"></span>
          <span class="keep-flash" aria-hidden="true"></span>
          <span class="keep-photo" aria-hidden="true"></span>
          <a class="hotspot hotspot--keep" href="https://app.bloomkeep.site/mauro50" target="_blank" rel="noreferrer">
            <span class="sr-only">Subir recuerdos</span>
          </a>
        </div>
      </section>

      <!-- 8. Confirmación -->
      <section class="panel panel--rsvp" aria-labelledby="rsvp-title" style="--bg: url(assets/confirmacion.webp)">
        <div class="panel__stage">
          <h2 id="rsvp-title" class="sr-only">Confirmá tu asistencia</h2>
          <img src="assets/confirmacion.webp" alt="Confirmá tu asistencia. Tenés tiempo hasta el 2 de enero" width="941" height="1672" loading="lazy" />
          <span class="whistle-glow" aria-hidden="true"></span>
          <a class="hotspot hotspot--rsvp" id="boton-confirmar" href="#" target="_blank" rel="noreferrer" data-pending="Para confirmar, abrí el link personalizado que te enviaron">
            <span class="sr-only">Confirmar asistencia</span>
          </a>
        </div>
      </section>

      <!-- 9. Footer -->
      <footer class="footer" aria-label="BloomDate y redes sociales">
        <div class="footer__art">
          <img src="assets/footer-bloomdate.webp" alt="Hecho con amor por BloomDate" width="1536" height="560" loading="lazy" />
          <a class="footer-link footer-link--whatsapp" href="https://wa.me/5491140436324" target="_blank" rel="noreferrer" aria-label="WhatsApp de BloomDate"></a>
          <a class="footer-link footer-link--instagram" href="https://www.instagram.com/bloomdate.invitaciones/" target="_blank" rel="noreferrer" aria-label="Instagram de BloomDate"></a>
          <a class="footer-link footer-link--website" href="https://bloomdate-site.netlify.app/" target="_blank" rel="noreferrer" aria-label="Sitio web de BloomDate"></a>
        </div>
      </footer>
    </main>

    <!-- Modal: Cómo llegar (diseño en imagen + botones invisibles) -->
    <dialog class="img-modal" id="locationModal" aria-labelledby="locationTitle">
      <div class="img-modal__stage">
        <img src="assets/modal-como-llegar.webp" alt="" width="941" height="1672" decoding="async" />
        <div class="sr-only">
          <h2 id="locationTitle">Room Eventos</h2>
          <p>Epecuén 4735, Villa Devoto</p>
        </div>
        <button class="img-modal__hit" style="left: 80.6%; top: 28.1%; width: 7.8%; height: 4.3%; border-radius: 50%" type="button" data-close aria-label="Cerrar"></button>
        <a class="img-modal__hit" style="left: 18.6%; top: 55.9%; width: 62.4%; height: 5.4%" href="https://www.google.com/maps/search/?api=1&amp;query=Room%20Eventos%2C%20Epecu%C3%A9n%204735%2C%20Villa%20Devoto%2C%20CABA" target="_blank" rel="noreferrer" aria-label="Abrir en Google Maps"></a>
        <a class="img-modal__hit" style="left: 18.6%; top: 62.8%; width: 62.4%; height: 5.4%" href="https://waze.com/ul?q=Epecu%C3%A9n%204735%2C%20Villa%20Devoto%2C%20CABA&amp;navigate=yes" target="_blank" rel="noreferrer" aria-label="Abrir en Waze"></a>
      </div>
    </dialog>

    <p class="toast" id="toast" role="status" aria-live="polite"></p>

    <!-- Música de fondo: arranca con el primer toque en la pantalla -->
    <audio id="bgMusic" src="assets/musica.mp3?v=1" preload="none" loop></audio>
    <button class="music-btn" id="musicToggle" type="button" aria-pressed="false" aria-label="Reproducir música">
      <svg class="music-btn__note" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5a2.5 2.5 0 1 1-2-2.45V5.5l11-2.2v12.2a2.5 2.5 0 1 1-2-2.45V7.1l-7 1.4z" /></svg>
      <span class="music-btn__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>

    <script src="script.js?v=5"></script>
    <script src="assets/invitation-personalization.js?v=1"></script>
  </body>
</html>
